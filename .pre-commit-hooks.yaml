- id: no-git-slop
  name: no-git-slop (block clutter files)
  entry: no-git-slop check --staged
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

- id: no-git-slop-commit-msg
  name: no-git-slop (commit message)
  entry: no-git-slop commit-msg
  language: python
  stages: [commit-msg]

- id: no-git-slop-pre-push
  name: no-git-slop (unpushed commits)
  entry: no-git-slop push-check
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-push]
