[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "no-git-slop"
version = "0.3.0"
description = "Keep AI coding agents from cluttering git repositories."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
no-git-slop = "no_git_slop.cli:main"
ngs = "no_git_slop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src", "tests"]
